# The dashboard lives in web/ and is a Next.js static export (output: "export"),
# so Netlify must build there and publish the generated out/ folder.
# Set NEXT_PUBLIC_API_URL in Netlify's environment variables to point at the
# deployed Worker; leave it unset to show built-in demo data.
[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "out"
  # Netlify skips a build when nothing under the base directory changed, but the
  # relay function (web/netlify/functions/market.mts) imports its logic from
  # worker/src. Rebuild when either changed. Runs from web/; exit 0 = skip.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../worker/src ../netlify.toml"

[build.environment]
  NODE_VERSION = "20"
