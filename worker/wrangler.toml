name = "solsnyper-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Watchdog only: re-arms the 45s Durable Object alarm loop if it was lost.
# (Cron's minimum interval is 1 minute; the DO alarm does the actual 45s ticks.)
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "solsnyper"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"

[durable_objects]
bindings = [{ name = "SCHEDULER", class_name = "Scheduler" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Scheduler"] # SQLite-backed DO: works on the Workers free plan

[vars]
# Set to your Pages URL (e.g. https://solsnyper.pages.dev) to lock CORS down.
ALLOWED_ORIGIN = "*"
# Unofficial endpoint; set "false" if it starts failing or you don't want it.
ENABLE_PUMPFUN = "true"

# Secrets (not in this file):
#   wrangler secret put ADMIN_TOKEN     # enables POST /api/run, /pause, /resume, /reset
